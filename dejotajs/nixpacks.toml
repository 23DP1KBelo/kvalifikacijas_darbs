[variables]
NIXPACKS_PHP_VERSION = "8.3"

[phases.setup]
nixPkgs = ["php83", "nodejs", "composer"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "npm install"
]

[phases.build]
cmds = [
  "npm run build",
  "ls -la public/build"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"